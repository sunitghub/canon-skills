<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>canon cockpit</title>
<link rel="stylesheet" href="/web/vendor/xterm.css" integrity="sha384-LJcOxlx9IMbNXDqJ2axpfEQKkAYbFjJfhXexLfiRJhjDU81mzgkiQq8rkV0j6dVh">
<style>
  :root{--bg:#0b0f17;--panel:#131a24;--panel2:#0d131c;--border:#232c3a;--text:#e6edf3;--dim:#8b98a9;--faint:#5b6675;--accent:#3b82f6;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--ui:Inter,system-ui,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ui)}
  #app{display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
  .brand .sq{width:18px;height:18px;border-radius:5px;background:var(--accent);display:inline-block}
  .start{display:flex;align-items:center;gap:8px;margin-left:6px}
  .start input{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font-family:var(--mono);font-size:13px;width:120px}
  button{border:0;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--ui)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .btn-start{background:var(--accent);color:#fff}
  .btn-kill{background:var(--panel2);color:var(--dim);border:1px solid var(--border)}
  .btn-kill:hover{color:var(--red);border-color:var(--red)}
  .spacer{flex:1}
  .status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);font-family:var(--mono)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  .dot.running{background:var(--yellow)} .dot.done{background:var(--green)} .dot.error{background:var(--red)}
  /* needs-you: the agent is blocked on a permission prompt or question. Pulses,
     because a static red reads the same as an error at a glance. */
  .dot.needsyou{background:var(--red);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  /* The board always loads this page with autostart=0 (both fresh-open and
     Resume) — the terminal sits idle until Start sprint is clicked manually,
     easy to miss otherwise. Pulse the button itself (not a separate label —
     a label next to Kill read as pointing at Kill) whenever it's waiting on
     that click. */
  .btn-start.pulse{animation:pulse 1.4s ease-in-out infinite}
  .status.needsyou{color:var(--red)}
  .model{font-family:var(--mono);font-size:11px;color:var(--faint)}
  #term-wrap{flex:1;min-height:0;background:var(--panel2);padding:8px}
  #terminal{height:100%}
  .hint{color:var(--faint);font-size:12px;padding:24px;font-family:var(--mono)}
  /* embed=1: the board frames this page and supplies ticket context, so trim
     the daemon page's own brand + ticket input; keep Start/Kill + status so a
     Resume (no autostart) can still be driven from inside the frame. */
  body.embed .brand{display:none}
  body.embed #ticket{display:none}
  body.embed header{padding:7px 12px}
  /* the board's own #ck-model chip is the single model readout in cockpit
     mode (t-ddc8) — this page's #model span is a static, never-updated
     placeholder, so hide it in embed to avoid a second, dead "model:" chip */
  body.embed .model{display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="sq"></span> canon <span style="color:var(--faint)">cockpit</span></div>
    <div class="start">
      <input id="ticket" placeholder="t-xxxx" spellcheck="false" autocomplete="off">
      <button class="btn-start" id="startBtn">▶ Start sprint</button>
      <button class="btn-kill" id="killBtn" disabled>Kill</button>
    </div>
    <div class="spacer"></div>
    <span class="model" id="model">model: from plan.md</span>
    <span class="status"><span class="dot" id="dot"></span><span id="statusText">idle</span></span>
  </header>
  <div id="term-wrap"><div id="terminal"></div></div>
</div>

<script src="/web/vendor/xterm.js" integrity="sha384-/nfmYPUzWMS6v2atn8hbljz7NE0EI1iGx34lJaNzyVjWGDzMv+ciUZUeJpKA3Glc"></script>
<script src="/web/vendor/xterm-addon-fit.js" integrity="sha384-AQLWHRKAgdTxkolJcLOELg4E9rE89CPE2xMy3tIRFn08NcGKPTsELdvKomqji+DL"></script>
<script>
(function(){
  "use strict";
  var TOKEN = "__COCKPIT_TOKEN__";
  var PREFILL = "__COCKPIT_TICKET__";
  var EMBED = "__COCKPIT_EMBED__";
  var AUTOSTART = "__COCKPIT_AUTOSTART__";
  var session = null, sessTok = null, previewTok = null, streamAbort = null;

  var term = new Terminal({
    fontFamily: "JetBrains Mono, ui-monospace, Menlo, monospace",
    fontSize: 13, cursorBlink: true,
    theme: { background: "#0d131c", foreground: "#e6edf3", cursor: "#3b82f6" }
  });
  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("terminal"));
  fit.fit();
  // Say plainly what Start does: a real agent session with this project's own
  // tool permissions, not a read-only status view (t-842b pre-mortem #4).
  term.writeln("\x1b[38;5;244mcanon cockpit — enter a ticket id and press Start to launch a real \x1b[1minteractive claude session\x1b[0m\x1b[38;5;244m on it (\x1b[1msprint start <id>\x1b[0m\x1b[38;5;244m).\x1b[0m");
  term.writeln("\x1b[38;5;244mIt runs with this project's own permission settings — it can write files and run commands, and prompts you here when they require approval.\x1b[0m");

  var dotEl = document.getElementById("dot"), statusEl = document.getElementById("statusText");
  var statusWrap = statusEl.parentNode, activeTicket = "";
  // t-f6b6: the board (a different origin — different port) has no way to
  // see into this iframe's own state, so every status change is mirrored out
  // via postMessage. "*" is fine outbound: nothing here is a secret, just a
  // status label — the real trust boundary is what THIS page accepts inbound
  // (see the message listener below).
  var STATUS_MAP = { running: "running", needsyou: "needs-you", done: "done", error: "error", "": "ended" };
  function setStatus(cls, text){
    dotEl.className = "dot " + (cls||"");
    statusWrap.className = "status" + (cls === "needsyou" ? " needsyou" : "");
    statusEl.textContent = text;
    try{
      window.parent.postMessage({ source: "canon-cockpit", type: "status", status: STATUS_MAP[cls] || cls }, "*");
    }catch(e){}
  }
  var LOOPBACK_ORIGIN = /^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?$/;
  var pendingMarker = null; // set while waiting for a save-and-end marker line
  // t-b19b: preview watch is independent of pendingMarker (it never kills the
  // session) — a prefix match, not exact, since both markers carry a variable
  // payload after the fixed prefix.
  var previewDeadline = 0; // epoch ms while watching for a preview marker; 0 = not watching
  var PREVIEW_FILE_PREFIX = "PREVIEW_FILE: ";
  var PREVIEW_SERVER_CMD_PREFIX = "PREVIEW_SERVER_CMD: ";
  var PREVIEW_TIMEOUT_MS = 60000;
  window.addEventListener("message", function(e){
    if(e.source !== window.parent) return;
    if(!LOOPBACK_ORIGIN.test(e.origin)) return;
    var d = e.data;
    if(!d || d.source !== "canon-cockpit") return;
    if(d.type === "save-and-end" && session){
      pendingMarker = "COCKPIT_STATE_SAVED";
      var prompt = "Please save your current state now: update plan.md/acceptance.md (and "
        + "HANDOFF.md if relevant) with where things stand and anything unresolved, then print "
        + "the exact line COCKPIT_STATE_SAVED on its own, and stop.";
      sendPrompt(prompt);
    } else if(d.type === "force-end" && session){
      pendingMarker = null;
      kill();
    } else if(d.type === "preview-request"){
      if(!session){
        // No live session to ask (e.g. a resumed ticket sitting idle pre-Start) —
        // reply immediately, since nothing else will ever arm the timeout below.
        try{ window.parent.postMessage({ source: "canon-cockpit", type: "preview-no-session" }, "*"); }catch(e){}
      } else {
        var deadline = Date.now() + PREVIEW_TIMEOUT_MS;
        previewDeadline = deadline;
        var previewPrompt = "If this ticket's deliverable is a single static HTML file needing no "
          + "server, print the exact line PREVIEW_FILE: <absolute path>. If it needs a running dev "
          + "server, print the exact line PREVIEW_SERVER_CMD: <the exact command to start it> -- "
          + "don't start anything yourself.";
        sendPrompt(previewPrompt);
        setTimeout(function(){
          if(previewDeadline === deadline){
            previewDeadline = 0;
            try{ window.parent.postMessage({ source: "canon-cockpit", type: "preview-timeout" }, "*"); }catch(e){}
          }
        }, PREVIEW_TIMEOUT_MS);
      }
    }
  });

  function authHeaders(tok){ return { "Authorization": "Bearer " + tok }; }

  // Claude Code's CLI treats a single "text\r" write as pasted text sitting
  // in the input box — it never submits. The trailing Enter has to land as
  // its own write, a beat after the text, to register as a submission (this
  // is a plain injected-prompt path, not user typing — term.onData already
  // forwards each real keystroke as its own write and is unaffected).
  function sendPrompt(text){
    fetch("/session/"+session+"/input", { method:"POST", headers: authHeaders(sessTok), body: text }).then(function(){
      setTimeout(function(){
        fetch("/session/"+session+"/input", { method:"POST", headers: authHeaders(sessTok), body: "\r" }).catch(function(){});
      }, 300);
    }).catch(function(){});
  }

  async function start(){
    var ticket = document.getElementById("ticket").value.trim();
    if(!/^t-[a-z0-9]{4}$/.test(ticket)){ term.writeln("\r\n\x1b[31minvalid ticket id (expected t-xxxx)\x1b[0m"); return; }
    document.getElementById("startBtn").classList.remove("pulse");
    setStatus("running","starting…");
    try{
      var r = await fetch("/session/start", { method:"POST", headers: Object.assign({"Content-Type":"application/json"}, authHeaders(TOKEN)), body: JSON.stringify({ticket:ticket}) });
      if(!r.ok){ setStatus("error","start failed ("+r.status+")"); term.writeln("\r\n\x1b[31mstart failed: "+r.status+"\x1b[0m"); return; }
      var j = await r.json();
      session = j.session; sessTok = j.token; previewTok = j.previewToken; activeTicket = ticket;
      // A second Start while this one is live would spawn a parallel session
      // on the same ticket — no daemon-side guard against it (t-2zoa, live).
      document.getElementById("startBtn").disabled = true;
      document.getElementById("killBtn").disabled = false;
      setStatus("running","running · "+ticket);
      term.clear();
      resize();
      attachStream();
    }catch(e){ setStatus("error","error"); term.writeln("\r\n\x1b[31m"+e+"\x1b[0m"); }
  }

  async function attachStream(){
    if(streamAbort) streamAbort.abort();
    streamAbort = new AbortController();
    var resp = await fetch("/session/"+session+"/stream", { headers: authHeaders(sessTok), signal: streamAbort.signal });
    if(!resp.ok){ setStatus("error","stream "+resp.status); return; }
    var reader = resp.body.getReader(), dec = new TextDecoder(), buf = "";
    while(true){
      var chunk = await reader.read();
      if(chunk.done) break;
      buf += dec.decode(chunk.value, {stream:true});
      var frames = buf.split("\n\n"); buf = frames.pop();
      for(var i=0;i<frames.length;i++){
        var ev="message", data="";
        frames[i].split("\n").forEach(function(line){
          if(line.indexOf("event:")===0) ev = line.slice(6).trim();
          else if(line.indexOf("data: ")===0) data += line.slice(6);
        });
        if(ev==="out" && data){
          var bytes = Uint8Array.from(atob(data), function(c){return c.charCodeAt(0);});
          term.write(bytes);
          if(pendingMarker || previewDeadline){
            var text = new TextDecoder().decode(bytes);
            var lines = text.split(/\r?\n/);
            for(var li=0; li<lines.length; li++){
              // Claude Code's own CLI rendering wraps an otherwise-bare marker
              // line in chrome (a leading "●"/">" bullet, markdown emphasis,
              // trailing backticks) — strip that before comparing, or an
              // exact/prefix match almost never fires on real output.
              var clean = lines[li].replace(/\x1b\[[0-9;?]*[a-zA-Z]/g, "").trim()
                .replace(/^[\s*_`>#•●○◦▸▹‣·-]+/, "").replace(/[\s*_`]+$/, "");
              // Whole-line exact match only — a coincidental substring
              // mid-sentence (the agent describing what it's about to do)
              // must not count.
              if(pendingMarker && clean === pendingMarker){
                pendingMarker = null;
                kill().then(function(){
                  try{ window.parent.postMessage({ source: "canon-cockpit", type: "ended" }, "*"); }catch(e){}
                });
                break;
              }
              // Prefix match, not exact — PREVIEW_FILE/PREVIEW_SERVER_CMD
              // carry a variable payload after the fixed prefix.
              if(previewDeadline && clean.indexOf(PREVIEW_FILE_PREFIX) === 0){
                previewDeadline = 0;
                var filePath = clean.slice(PREVIEW_FILE_PREFIX.length).trim();
                // The daemon re-validates this path itself (symlink-safe
                // containment under projectRoot) before this page relays
                // anything to the board — cockpit.html has no privileged
                // position to assert the path is safe on its own.
                fetch("/session/"+session+"/preview-root", {
                  method: "POST",
                  headers: Object.assign({"Content-Type":"application/json"}, authHeaders(sessTok)),
                  body: JSON.stringify({ path: filePath })
                }).then(function(pr){
                  if(pr.ok){
                    var relpath = filePath.split(/[\\/]/).pop();
                    try{ window.parent.postMessage({ source: "canon-cockpit", type: "preview-file", session: session, previewToken: previewTok, relpath: relpath }, "*"); }catch(e){}
                  } else {
                    try{ window.parent.postMessage({ source: "canon-cockpit", type: "preview-rejected" }, "*"); }catch(e){}
                  }
                }).catch(function(){
                  try{ window.parent.postMessage({ source: "canon-cockpit", type: "preview-rejected" }, "*"); }catch(e){}
                });
                break;
              }
              if(previewDeadline && clean.indexOf(PREVIEW_SERVER_CMD_PREFIX) === 0){
                previewDeadline = 0;
                var serverCmd = clean.slice(PREVIEW_SERVER_CMD_PREFIX.length).trim();
                try{ window.parent.postMessage({ source: "canon-cockpit", type: "preview-server-cmd", cmd: serverCmd }, "*"); }catch(e){}
                break;
              }
            }
          }
        }
        else if(ev==="status" && data){
          var st = atob(data);
          if(st === "needs-you") setStatus("needsyou","needs you · "+activeTicket);
          else setStatus("running","running · "+activeTicket);
        }
        else if(ev==="exit"){ setStatus("done","finished"); document.getElementById("startBtn").disabled = false; document.getElementById("killBtn").disabled = true; }
      }
    }
  }

  term.onData(function(d){
    if(!session) return;
    fetch("/session/"+session+"/input", { method:"POST", headers: authHeaders(sessTok), body: d }).catch(function(){});
  });

  function resize(){
    fit.fit();
    if(!session) return;
    fetch("/session/"+session+"/resize", { method:"POST", headers: Object.assign({"Content-Type":"application/json"}, authHeaders(sessTok)), body: JSON.stringify({cols:term.cols, rows:term.rows}) }).catch(function(){});
  }
  window.addEventListener("resize", resize);

  async function kill(){
    if(!session) return;
    await fetch("/session/"+session+"/kill", { method:"POST", headers: authHeaders(sessTok) }).catch(function(){});
    if(streamAbort) streamAbort.abort();
    setStatus("","killed"); document.getElementById("killBtn").disabled = true; document.getElementById("startBtn").disabled = false; session=null; sessTok=null;
  }

  document.getElementById("startBtn").addEventListener("click", start);
  document.getElementById("killBtn").addEventListener("click", kill);
  document.getElementById("ticket").addEventListener("keydown", function(e){ if(e.key==="Enter") start(); });
  if(PREFILL){ document.getElementById("ticket").value = PREFILL; }
  if(EMBED === "1"){ document.body.classList.add("embed"); }
  if(AUTOSTART === "1" && PREFILL){ start(); }
  else if(PREFILL){ document.getElementById("startBtn").classList.add("pulse"); }
})();
</script>
</body>
</html>
