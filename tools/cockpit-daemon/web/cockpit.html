<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>canon cockpit</title>
<link rel="stylesheet" href="/web/vendor/xterm.css" integrity="sha384-LJcOxlx9IMbNXDqJ2axpfEQKkAYbFjJfhXexLfiRJhjDU81mzgkiQq8rkV0j6dVh">
<style>
  :root{--bg:#0b0f17;--panel:#131a24;--panel2:#0d131c;--border:#232c3a;--text:#e6edf3;--dim:#8b98a9;--faint:#5b6675;--accent:#3b82f6;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--ui:Inter,system-ui,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ui)}
  #app{display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
  .brand .sq{width:18px;height:18px;border-radius:5px;background:var(--accent);display:inline-block}
  .start{display:flex;align-items:center;gap:8px;margin-left:6px}
  .start input{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font-family:var(--mono);font-size:13px;width:120px}
  .start select{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 8px;font-family:var(--mono);font-size:13px}
  button{border:0;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--ui)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .btn-start{background:var(--accent);color:#fff}
  .btn-kill{background:var(--panel2);color:var(--dim);border:1px solid var(--border)}
  .btn-kill:hover{color:var(--red);border-color:var(--red)}
  .spacer{flex:1}
  .status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);font-family:var(--mono)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  .dot.running{background:var(--yellow)} .dot.done{background:var(--green)} .dot.error{background:var(--red)}
  /* needs-you: the agent is blocked on a permission prompt or question. Pulses,
     because a static red reads the same as an error at a glance. */
  .dot.needsyou{background:var(--red);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  /* The board always loads this page with autostart=0 (both fresh-open and
     Resume) — the terminal sits idle until Start sprint is clicked manually,
     easy to miss otherwise. Pulse the button itself (not a separate label —
     a label next to Kill read as pointing at Kill) whenever it's waiting on
     that click. */
  .btn-start.pulse{animation:pulse 1.4s ease-in-out infinite}
  .status.needsyou{color:var(--red)}
  .model{font-family:var(--mono);font-size:11px;color:var(--faint)}
  /* t-0d67: like .model but NOT hidden in embed mode — the board frames the
     cockpit with embed=1, and the "last used · model" hint must stay visible. */
  .agent-hint{font-family:var(--mono);font-size:11px;color:var(--faint)}
  #term-wrap{flex:1;min-height:0;background:var(--panel2);padding:8px}
  #terminal{height:100%}
  .hint{color:var(--faint);font-size:12px;padding:24px;font-family:var(--mono)}
  /* embed=1: the board frames this page and supplies ticket context, so trim
     the daemon page's own brand + ticket input; keep Start/Kill + status so a
     Resume (no autostart) can still be driven from inside the frame. */
  body.embed .brand{display:none}
  body.embed #ticket{display:none}
  body.embed header{padding:7px 12px}
  /* the board's own #ck-model chip is the single model readout in cockpit
     mode (t-ddc8) — this page's #model span is a static, never-updated
     placeholder, so hide it in embed to avoid a second, dead "model:" chip */
  body.embed .model{display:none}
  /* t-74d6: stale-daemon banner — the board detects a version-drifted daemon
     and relays it in; the Restart button calls the token-gated /shutdown. */
  .stale-banner{display:flex;align-items:center;gap:10px;padding:7px 12px;
    background:rgba(234,179,8,.12);border-bottom:1px solid var(--yellow);
    color:var(--yellow);font-size:12px;font-family:var(--mono)}
  .stale-banner[hidden]{display:none}
  .stale-banner .sb-msg{flex:1}
  .stale-banner button{border:0;border-radius:6px;padding:5px 10px;font-size:12px;
    font-weight:600;cursor:pointer}
  .stale-banner button:disabled{opacity:.5;cursor:default}
  .stale-banner .sb-restart{background:var(--accent);color:#fff}
  .stale-banner .sb-force{background:var(--red);color:#fff}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="sq"></span> canon <span style="color:var(--faint)">cockpit</span></div>
    <div class="start">
      <input id="ticket" placeholder="t-xxxx" spellcheck="false" autocomplete="off">
      <select id="agentSel" title="Agent to launch on Start">
        <option value="claude">Claude Code</option>
        <option value="pi">Pi</option>
      </select>
      <button class="btn-start" id="startBtn">▶ Start sprint</button>
      <button class="btn-kill" id="killBtn" disabled>Kill</button>
    </div>
    <div class="spacer"></div>
    <span class="agent-hint" id="agentHint"></span>
    <span class="model" id="model">model: from plan.md</span>
    <span class="status"><span class="dot" id="dot"></span><span id="statusText">idle</span></span>
  </header>
  <div id="staleBanner" class="stale-banner" hidden>
    <span class="sb-msg" id="sbMsg"></span>
    <button class="sb-restart" id="sbRestart">Restart</button>
  </div>
  <div id="term-wrap"><div id="terminal"></div></div>
</div>

<script src="/web/vendor/xterm.js" integrity="sha384-/nfmYPUzWMS6v2atn8hbljz7NE0EI1iGx34lJaNzyVjWGDzMv+ciUZUeJpKA3Glc"></script>
<script src="/web/vendor/xterm-addon-fit.js" integrity="sha384-AQLWHRKAgdTxkolJcLOELg4E9rE89CPE2xMy3tIRFn08NcGKPTsELdvKomqji+DL"></script>
<script>
(function(){
  "use strict";
  var TOKEN = "__COCKPIT_TOKEN__";
  var PREFILL = "__COCKPIT_TICKET__";
  var EMBED = "__COCKPIT_EMBED__";
  var AUTOSTART = "__COCKPIT_AUTOSTART__";
  var PREFILL_CWD = "__COCKPIT_CWD__"; // t-cd06: worktree path the board selected, or "" for main checkout
  var AGENT = "__COCKPIT_AGENT__" || "claude"; // t-0d67: default picker selection (last-used)
  var AGENT_HINT = "__COCKPIT_AGENT_HINT__";   // e.g. "Last used: Claude Code · model: sonnet"
  (function initAgentPicker(){
    var sel = document.getElementById("agentSel");
    if(sel && (AGENT === "claude" || AGENT === "pi")) sel.value = AGENT;
    var h = document.getElementById("agentHint");
    if(h) h.textContent = AGENT_HINT;
  })();
  var session = null, sessTok = null, previewTok = null, streamAbort = null;

  var term = new Terminal({
    fontFamily: "JetBrains Mono, ui-monospace, Menlo, monospace",
    fontSize: 18, lineHeight: 1.25, fontWeight: 500, fontWeightBold: 700,
    cursorBlink: true,
    theme: { background: "#0d131c", foreground: "#e6edf3", cursor: "#3b82f6" }
  });
  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("terminal"));
  fit.fit();
  // t-842b: say plainly what Start does — a real agent session with this
  // project's own tool permissions, not a read-only status view. The message is
  // context-aware: framed by the board (EMBED), the ticket is already chosen and
  // the button is "Start sprint" — there is no ticket id to enter, so don't tell
  // the user to enter one. Standalone, the page's own ticket-id input applies.
  if (EMBED === "1") {
    var who = PREFILL ? "\x1b[1m" + PREFILL + "\x1b[0m\x1b[38;5;244m" : "this ticket";
    term.writeln("\x1b[38;5;244mcanon cockpit — press \x1b[1m\u25B6 Start sprint\x1b[0m\x1b[38;5;244m to launch a real \x1b[1minteractive agent session\x1b[0m\x1b[38;5;244m for " + who + ".\x1b[0m");
  } else {
    term.writeln("\x1b[38;5;244mcanon cockpit — enter a ticket id and press Start to launch a real \x1b[1minteractive agent session\x1b[0m\x1b[38;5;244m on it (\x1b[1msprint start <id>\x1b[0m\x1b[38;5;244m).\x1b[0m");
  }
  term.writeln("\x1b[38;5;244mIt runs with this project's own permission settings — it can write files and run commands, and prompts you here when they require approval.\x1b[0m");

  var dotEl = document.getElementById("dot"), statusEl = document.getElementById("statusText");
  var statusWrap = statusEl.parentNode, activeTicket = "";
  // t-f6b6: the board (a different origin — different port) has no way to
  // see into this iframe's own state, so every status change is mirrored out
  // via postMessage. "*" is fine outbound: nothing here is a secret, just a
  // status label — the real trust boundary is what THIS page accepts inbound
  // (see the message listener below).
  var STATUS_MAP = { running: "running", needsyou: "needs-you", done: "done", error: "error", "": "ended" };
  function setStatus(cls, text){
    lastStatusCls = cls || "";
    dotEl.className = "dot " + (cls||"");
    statusWrap.className = "status" + (cls === "needsyou" ? " needsyou" : "");
    statusEl.textContent = text;
    if(typeof sbUpdateControls === "function") sbUpdateControls();
    try{
      window.parent.postMessage({ source: "canon-cockpit", type: "status", status: STATUS_MAP[cls] || cls }, "*");
    }catch(e){}
  }
  var LOOPBACK_ORIGIN = /^http:\/\/(127\.0\.0\.1|localhost)(:\d+)?$/;
  var pendingMarker = null; // set while waiting for a save-and-end marker line
  // t-b19b: preview watch is independent of pendingMarker (it never kills the
  // session) — a prefix match, not exact, since both markers carry a variable
  // payload after the fixed prefix.
  var previewDeadline = 0; // epoch ms while watching for a preview marker; 0 = not watching
  // Each SSE "out" frame is one raw PTY read (main.go reads in up to 8KB
  // chunks) — a marker line can land split across two frames. Carry any
  // trailing incomplete line over to the next frame instead of matching
  // per-frame, or a marker that straddles a read boundary never matches.
  var markerBuf = "";
  var PREVIEW_TIMEOUT_MS = 60000;
  window.addEventListener("message", function(e){
    if(e.source !== window.parent) return;
    if(!LOOPBACK_ORIGIN.test(e.origin)) return;
    var d = e.data;
    if(!d || d.source !== "canon-cockpit") return;
    if(d.type === "save-and-end" && session){
      // t-2c9e: the daemon owns Save & End detection now — it injects the save
      // prompt and ends on the PTY marker, on the watched state files settling
      // (agent-agnostic; pi's full-screen TUI never yields a clean marker line
      // the claude-tuned parser survives), or on the fallback. We just trigger
      // it and end on the "saved" SSE frame (handled in attachStream).
      fetch("/session/"+session+"/save-and-end", { method:"POST", headers: authHeaders(sessTok) }).catch(function(){});
    } else if(d.type === "force-end" && session){
      pendingMarker = null;
      kill();
    } else if(d.type === "preview-request"){
      if(!session){
        // No live session to ask (e.g. a resumed ticket sitting idle pre-Start) —
        // reply immediately, since nothing else will ever arm the timeout below.
        try{ window.parent.postMessage({ source: "canon-cockpit", type: "preview-no-session" }, "*"); }catch(e){}
      } else {
        var deadline = Date.now() + PREVIEW_TIMEOUT_MS;
        previewDeadline = deadline;
        markerBuf = "";
        var previewPrompt = "If this ticket's deliverable is a single static HTML file needing no "
          + "server, print the exact line PREVIEW_FILE: <absolute path>. If it needs a running dev "
          + "server, print the exact line PREVIEW_SERVER_CMD: <the exact command to start it> -- "
          + "don't start anything yourself.";
        sendPrompt(previewPrompt);
        setTimeout(function(){
          if(previewDeadline === deadline){
            previewDeadline = 0;
            try{ window.parent.postMessage({ source: "canon-cockpit", type: "preview-timeout" }, "*"); }catch(e){}
          }
        }, PREVIEW_TIMEOUT_MS);
      }
    } else if(d.type === "daemon-build"){
      showStaleBanner(d.info);
    }
  });

  function authHeaders(tok){ return { "Authorization": "Bearer " + tok }; }

  // ── t-74d6: stale-daemon banner ──────────────────────────────────────────
  // The board (which can stat the on-disk binary) detects a version-drifted
  // daemon and relays {stale, running_build, latest_build} in via postMessage.
  // Restart calls the token-gated /shutdown (this page holds the boot token);
  // the daemon refuses 409 while a session is live unless Force is confirmed.
  var staleBanner = document.getElementById("staleBanner");
  var sbMsg = document.getElementById("sbMsg");
  var sbRestart = document.getElementById("sbRestart");
  var sbBaseMsg = "";        // the stale message without any busy suffix
  var lastStatusCls = "";    // mirrors setStatus's cls so the banner knows if a session is live
  function sbFmtTime(unix){ try { return new Date(unix*1000).toLocaleTimeString(); } catch(e){ return String(unix); } }
  function sbSessionLive(){ return lastStatusCls === "running" || lastStatusCls === "needsyou"; }
  function sbEnsureForce(){
    if(!document.getElementById("sbForce")){
      var fb = document.createElement("button");
      fb.id = "sbForce"; fb.className = "sb-force"; fb.textContent = "Force restart";
      fb.addEventListener("click", function(){
        if(window.confirm("Force restart ends the running agent session. Continue?")) sbDoRestart(true);
      });
      staleBanner.appendChild(fb);
    }
  }
  function sbRemoveForce(){ var f = document.getElementById("sbForce"); if(f) f.remove(); }
  // Reflect session-busy state on the controls: a live session DISABLES the
  // plain Restart (never blind-kill a running agent) and offers Force restart
  // behind a confirm; idle re-enables the plain Restart. The daemon's 409 is the
  // backstop guarantee if a session starts between render and click.
  function sbUpdateControls(){
    if(!staleBanner || staleBanner.hidden) return;
    if(sbSessionLive()){
      sbRestart.disabled = true;
      sbMsg.textContent = sbBaseMsg + " — finish or Kill the running session first.";
      sbEnsureForce();
    } else {
      sbRestart.disabled = false;
      sbMsg.textContent = sbBaseMsg;
      sbRemoveForce();
    }
  }
  function showStaleBanner(info){
    if(!info || !info.stale){ staleBanner.hidden = true; return; }
    var rb = info.running_build || {}, lb = info.latest_build || {};
    var rlabel = rb.version ? rb.version : "unknown";
    var rt = rb.exe_mtime ? sbFmtTime(rb.exe_mtime) : "?";
    var lt = lb.exe_mtime ? sbFmtTime(lb.exe_mtime) : "?";
    sbBaseMsg = "\u26A0 Cockpit daemon out of date (running " + rlabel + ", built " + rt + "; latest built " + lt + ")";
    sbRestart.textContent = "Restart";
    staleBanner.hidden = false;
    sbUpdateControls();
  }
  function sbDoRestart(force){
    sbRestart.disabled = true;
    fetch("/shutdown" + (force ? "?force=1" : ""), { method:"POST", headers: authHeaders(TOKEN) })
      .then(function(r){
        if(r.status === 200){
          sbMsg.textContent = "Restarting cockpit daemon\u2026";
          sbRemoveForce();
          try{ window.parent.postMessage({ source:"canon-cockpit", type:"daemon-restarting" }, "*"); }catch(e){}
        } else if(r.status === 409){
          // A session became live between render and click — reflect busy state.
          lastStatusCls = "running";
          sbUpdateControls();
        } else {
          sbMsg.textContent = "Restart failed (" + r.status + ").";
          sbRestart.disabled = false;
        }
      })
      .catch(function(){ sbMsg.textContent = "Restart request failed."; sbRestart.disabled = false; });
  }
  sbRestart.addEventListener("click", function(){ sbDoRestart(false); });

  // Claude Code's CLI treats a single "text\r" write as pasted text sitting
  // in the input box — it never submits. The trailing Enter has to land as
  // its own write, a beat after the text, to register as a submission (this
  // is a plain injected-prompt path, not user typing — term.onData already
  // forwards each real keystroke as its own write and is unaffected).
  function sendPrompt(text){
    fetch("/session/"+session+"/input", { method:"POST", headers: authHeaders(sessTok), body: text }).then(function(){
      setTimeout(function(){
        fetch("/session/"+session+"/input", { method:"POST", headers: authHeaders(sessTok), body: "\r" }).catch(function(){});
      }, 300);
    }).catch(function(){});
  }

  async function start(){
    var ticket = document.getElementById("ticket").value.trim();
    if(!/^t-[a-z0-9]{4}$/.test(ticket)){ term.writeln("\r\n\x1b[31minvalid ticket id (expected t-xxxx)\x1b[0m"); return; }
    document.getElementById("startBtn").classList.remove("pulse");
    setStatus("running","starting…");
    try{
      var agent = (document.getElementById("agentSel") || {}).value || AGENT || "claude";
      var r = await fetch("/session/start", { method:"POST", headers: Object.assign({"Content-Type":"application/json"}, authHeaders(TOKEN)), body: JSON.stringify({ticket:ticket, cwd:PREFILL_CWD, agent:agent}) });
      if(!r.ok){
        // t-2a1c: surface the daemon's own message (e.g. "ticket not visible in
        // this worktree") instead of a bare status code, and point at the fix.
        var detail = "";
        try { detail = (await r.text()).trim(); } catch(e){}
        setStatus("error","start failed ("+r.status+")");
        term.writeln("\r\n\x1b[31mstart failed ("+r.status+")"+(detail ? ": "+detail : "")+"\x1b[0m");
        if(r.status===400 && /not visible in this worktree/i.test(detail)){
          term.writeln("\x1b[33mThis ticket is locked to a worktree that doesn't contain it. In the board's WORKTREE panel, click \u201CUnlock worktree\u201D to run in the Main checkout, or commit .tickets/ into that worktree.\x1b[0m");
        }
        return;
      }
      var j = await r.json();
      session = j.session; sessTok = j.token; previewTok = j.previewToken; activeTicket = ticket;
      // t-7590: report the cwd the daemon actually resolved (not PREFILL_CWD,
      // which may have been ignored/overridden) so the board's "Working in:"
      // reflects reality and can flag a wrong-tree mismatch.
      // t-eed3: also relay the daemon-resolved `requested` cwd so the board can
      // compare like-for-like and suppress a symlink-only false mismatch.
      try{ window.parent.postMessage({ source: "canon-cockpit", type: "started", cwd: (j.cwd || ""), requested: (j.requested || "") }, "*"); }catch(e){}
      // A second Start while this one is live would spawn a parallel session
      // on the same ticket — no daemon-side guard against it (t-2zoa, live).
      document.getElementById("startBtn").disabled = true;
      document.getElementById("killBtn").disabled = false;
      setStatus("running","running · "+ticket);
      term.clear();
      resize();
      attachStream();
    }catch(e){ setStatus("error","error"); term.writeln("\r\n\x1b[31m"+e+"\x1b[0m"); }
  }

  async function attachStream(){
    if(streamAbort) streamAbort.abort();
    streamAbort = new AbortController();
    var resp = await fetch("/session/"+session+"/stream", { headers: authHeaders(sessTok), signal: streamAbort.signal });
    if(!resp.ok){ setStatus("error","stream "+resp.status); return; }
    var reader = resp.body.getReader(), dec = new TextDecoder(), buf = "";
    while(true){
      var chunk = await reader.read();
      if(chunk.done) break;
      buf += dec.decode(chunk.value, {stream:true});
      var frames = buf.split("\n\n"); buf = frames.pop();
      for(var i=0;i<frames.length;i++){
        var ev="message", data="";
        frames[i].split("\n").forEach(function(line){
          if(line.indexOf("event:")===0) ev = line.slice(6).trim();
          else if(line.indexOf("data: ")===0) data += line.slice(6);
        });
        if(ev==="saved"){
          // t-2c9e: the daemon detected Save & End completion (marker or the
          // state files settling) and is ending the session — tell the board.
          try{ window.parent.postMessage({ source: "canon-cockpit", type: "ended" }, "*"); }catch(e){}
          continue;
        }
        if(ev==="out" && data){
          var bytes = Uint8Array.from(atob(data), function(c){return c.charCodeAt(0);});
          term.write(bytes);
          if(pendingMarker || previewDeadline){
            // Accumulate across frames — this frame may end mid-line (the
            // next PTY read continues it). Only the completed lines are
            // matched here; the trailing partial line carries over.
            markerBuf += new TextDecoder().decode(bytes);
            if(markerBuf.length > 16384) markerBuf = markerBuf.slice(-16384);
            // Claude Code's TUI (Ink) does NOT emit newline-terminated lines:
            // it positions every screen row with a bare "\r" + a cursor-move
            // escape (e.g. "\x1b[2B" = down 2) and NEVER a "\n", and it renders
            // the gap between a label and its value as a cursor COLUMN jump
            // ("PREVIEW_FILE:\x1b[17G/Users/…") rather than a literal space. So
            // (1) splitting on /\r?\n/ found zero complete lines — everything
            // stayed in the "trailing partial" and was never compared, and
            // (2) even a compared line read "PREVIEW_FILE:/Users/…" with no
            // space, missing a `"PREVIEW_FILE: "` prefix check. Fix: strip ANSI
            // (CSI) + OSC hyperlinks first, split on \r OR \n (so a CR-only TUI
            // and a real CRLF/newline both row-split, incl. Windows CRLF), and
            // re-scan the whole buffer each frame (redraws repeat the marker, so
            // first-match-wins under the previewDeadline/pendingMarker guards).
            var flat = markerBuf
              .replace(/\x1b\][\s\S]*?(?:\x07|\x1b\\)/g, "") // OSC (e.g. \x1b]8;…\x07 hyperlinks)
              .replace(/\x1b\[[0-9;?]*[a-zA-Z]/g, "");        // CSI (colors, cursor moves, erases)
            var rows = flat.split(/[\r\n]+/);
            for(var li=0; li<rows.length; li++){
              // Strip leading chrome (bullets ⏺/●/•, markdown, quote/list
              // markers) and trailing backticks/space before comparing.
              var clean = rows[li].trim()
                .replace(/^[\s*_`>#•●⏺○◦▸▹‣·-]+/, "").replace(/[\s*_`]+$/, "");
              // Whole-line exact match only — a coincidental substring
              // mid-sentence (the agent describing what it's about to do)
              // must not count.
              if(pendingMarker && clean === pendingMarker){
                pendingMarker = null;
                kill().then(function(){
                  try{ window.parent.postMessage({ source: "canon-cockpit", type: "ended" }, "*"); }catch(e){}
                });
                break;
              }
              // Tolerant marker match: the label, optional whitespace (Claude
              // renders it as a cursor jump → often zero spaces after ANSI
              // strip), then an ABSOLUTE path. Requiring absolute — POSIX "/…",
              // Windows drive "C:\…"/"C:/…", or UNC "\\host\share" — is what
              // lets us safely scan every row: the echoed prompt line's literal
              // "<absolute path>" placeholder starts with "<" and can never
              // match, so it's ignored. The daemon still re-validates the path
              // (symlink-safe containment under projectRoot); cockpit.html has
              // no privileged position to assert safety on its own.
              if(previewDeadline){
                var mFile = clean.match(/^PREVIEW_FILE:\s*((?:\/|\\\\|[A-Za-z]:[\\/]).*\S)$/);
                if(mFile){
                  previewDeadline = 0;
                  var filePath = mFile[1].replace(/[`'"\s]+$/, "");
                  fetch("/session/"+session+"/preview-root", {
                    method: "POST",
                    headers: Object.assign({"Content-Type":"application/json"}, authHeaders(sessTok)),
                    body: JSON.stringify({ path: filePath })
                  }).then(function(pr){
                    if(pr.ok){
                      // Basename via both separators so a Windows path splits too.
                      var relpath = filePath.split(/[\\/]/).pop();
                      try{ window.parent.postMessage({ source: "canon-cockpit", type: "preview-file", session: session, previewToken: previewTok, relpath: relpath }, "*"); }catch(e){}
                    } else {
                      try{ window.parent.postMessage({ source: "canon-cockpit", type: "preview-rejected" }, "*"); }catch(e){}
                    }
                  }).catch(function(){
                    try{ window.parent.postMessage({ source: "canon-cockpit", type: "preview-rejected" }, "*"); }catch(e){}
                  });
                  break;
                }
                // Server command: any non-empty value that isn't the "<…>"
                // placeholder from the echoed prompt.
                var mCmd = clean.match(/^PREVIEW_SERVER_CMD:\s*([^<\s].*\S|[^<\s])$/);
                if(mCmd){
                  previewDeadline = 0;
                  var serverCmd = mCmd[1].replace(/[`'"\s]+$/, "");
                  try{ window.parent.postMessage({ source: "canon-cockpit", type: "preview-server-cmd", cmd: serverCmd }, "*"); }catch(e){}
                  break;
                }
              }
            }
          }
        }
        else if(ev==="status" && data){
          var st = atob(data);
          if(st === "needs-you") setStatus("needsyou","needs you · "+activeTicket);
          else setStatus("running","running · "+activeTicket);
        }
        else if(ev==="exit"){ setStatus("done","finished"); document.getElementById("startBtn").disabled = false; document.getElementById("killBtn").disabled = true; }
      }
    }
  }

  term.onData(function(d){
    if(!session) return;
    fetch("/session/"+session+"/input", { method:"POST", headers: authHeaders(sessTok), body: d }).catch(function(){});
  });

  function resize(){
    fit.fit();
    if(!session) return;
    fetch("/session/"+session+"/resize", { method:"POST", headers: Object.assign({"Content-Type":"application/json"}, authHeaders(sessTok)), body: JSON.stringify({cols:term.cols, rows:term.rows}) }).catch(function(){});
  }
  window.addEventListener("resize", resize);

  async function kill(){
    if(!session) return;
    await fetch("/session/"+session+"/kill", { method:"POST", headers: authHeaders(sessTok) }).catch(function(){});
    if(streamAbort) streamAbort.abort();
    setStatus("","killed"); document.getElementById("killBtn").disabled = true; document.getElementById("startBtn").disabled = false; session=null; sessTok=null;
  }

  document.getElementById("startBtn").addEventListener("click", start);
  document.getElementById("killBtn").addEventListener("click", kill);
  document.getElementById("ticket").addEventListener("keydown", function(e){ if(e.key==="Enter") start(); });
  if(PREFILL){ document.getElementById("ticket").value = PREFILL; }
  if(EMBED === "1"){ document.body.classList.add("embed"); }
  if(AUTOSTART === "1" && PREFILL){ start(); }
  else if(PREFILL){ document.getElementById("startBtn").classList.add("pulse"); }
})();
</script>
</body>
</html>
