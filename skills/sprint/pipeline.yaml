# canon's default sprint pipeline (t-00e0): the one list of the sprint's steps and gates.
# Read by tools/pipeline.sh, which accepts only the YAML subset written here:
#   nodes:                      once, first
#     - id: <lowercase-id>      starts a node (letters, digits and '-', starting with a letter)
#       kind: step|gate|agent|you
#       order: <number>         unique; the run order, gaps are left on purpose
#       locked: true|false      a locked node cannot be switched off; it needs a reason
#       reason: "<why>"         quoted text, no inner quotes
#       group: wrapup           optional; the nodes a project may reorder among themselves
#       when: "<condition>"     optional; the automatic skip condition (a node that does not apply is skipped, not removed)
#       prompt: <path>          optional; the file a node's View prompt opens (relative to canon's folder)
#       skip_on: lite|manual|lite,manual  optional; the ticket options that skip this node (Lite = `demo: true`, Manual = `manual: true`): the one list the Pipeline tab and Sprint progress show; display only, the close protocol (complete.md) is what runs
#       only: manual            optional; the node exists for that ticket option alone (left out of the plain resolve list, so the approve-time pin is unchanged)
#       before_approval: true   optional; the node runs before approve-plan (its order must be lower), so it cannot change after approval and is left out of the pin (t-9b13)
#       produces: <rule id>     optional; the node's postcondition, an internal/artifact rule (`canon-go walk`; t-2bfe). A node's preconditions are every
#                               earlier ON node's produces (derived from order, never listed): sprint next names a miss and sprint approve refuses on one
#       note: "<what to do>"    optional; what sprint next prints when the node's produces does not hold
# A project override lives at <project>/canon-config/pipeline.yaml and holds only what differs (see tools/pipeline.sh):
#   extends: canon-default
#   off: [mutation-test]
#   wrapup-order: [doc-audit, code-reviewer, code-simplifier]
# Gate names here are the rows of acceptance.md's "## Wrapup Gates" table; tests/pipeline.sh fails when a doc names one this file lacks.
nodes:
  - id: start
    kind: step
    order: 10
    locked: true
    reason: "Always runs: every sprint starts with a ticket and a plan."
    prompt: skills/sprint/reference/start-checklist.md
  - id: plan
    kind: step
    order: 20
    locked: true
    reason: "Always runs: the plan is the contract the gates grade."
    prompt: skills/sprint/reference/start-checklist.md
  - id: spec-check
    kind: agent
    order: 25
    locked: false
    before_approval: true
    prompt: skills/sprint/reference/spec-check.md
    skip_on: lite
    produces: spec.verdict
    note: "the spec check has not run: dispatch canon-spec-checker with sprint gate-prompt <id> speccheck before the brief (start-checklist.md step 9)"
  - id: approve-plan
    kind: you
    order: 30
    locked: true
    reason: "Always runs: no code before the user approves the plan."
    produces: plan.approved-stamp
    note: "show the person the brief and wait for their explicit approval, then run sprint approve <id> (start-checklist.md step 11)"
  - id: build
    kind: step
    order: 40
    locked: true
    reason: "Always runs: it is the sprint's own work."
  - id: your-test
    kind: you
    order: 45
    locked: true
    reason: "Manual tickets only: you test by hand, and sprint manual-qa records what you saw. Waiting for your test until a fresh record exists."
    when: "Manual tickets only"
    only: manual
  - id: code-simplifier
    kind: gate
    order: 50
    locked: false
    group: wrapup
    when: "code changed (not docs, comments or config only)"
    prompt: skills/wrapup/gates/simplifier.md
    skip_on: lite
  - id: code-reviewer
    kind: gate
    order: 52
    locked: false
    group: wrapup
    when: "not a single-line or mechanical change"
    prompt: skills/wrapup/gates/reviewer.md
    skip_on: lite
  - id: doc-audit
    kind: gate
    order: 54
    locked: false
    group: wrapup
    when: "user-facing docs or skill frontmatter changed"
    prompt: skills/doc-audit/SKILL.md
    skip_on: lite
  - id: skill-eval
    kind: gate
    order: 60
    locked: false
    when: "a skill or gate agent changed (tools/skill-eval-scope.sh)"
    prompt: skills/skill-eval/SKILL.md
    skip_on: lite
  - id: break-it
    kind: agent
    order: 62
    locked: false
    when: "high-risk or untrusted-input sprint"
    prompt: skills/sprint/reference/break-it.md
    skip_on: lite
  - id: reviewer
    kind: agent
    order: 70
    locked: false
    prompt: skills/sprint/reference/review.md
    skip_on: lite,manual
  - id: security-review
    kind: gate
    order: 80
    locked: true
    reason: "Always runs: it reviews the final diff for input, secrets and trust-boundary problems."
    prompt: skills/wrapup/gates/security-review.md
  - id: mutation-test
    kind: gate
    order: 90
    locked: false
    when: "shell, JS, Python or Go logic files changed; needs python3 (skipped with a reason when it is missing)"
    prompt: skills/mutation-test/SKILL.md
    skip_on: lite,manual
  - id: eval
    kind: agent
    order: 100
    locked: true
    reason: "Always runs: the binding evaluator is the floor of every close."
    prompt: skills/sprint/reference/eval.md
  - id: close
    kind: step
    order: 110
    locked: true
    reason: "Always runs: sprint complete is how a ticket closes."
    prompt: skills/sprint/reference/complete-checklist.md
